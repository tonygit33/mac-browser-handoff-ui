<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mac shell bridge</title>
<pre id="out">connecting</pre>
<script type="module">
const out=document.getElementById('out');
const q=new URLSearchParams(location.hash.slice(1));
const room=q.get('room')||'';
const secret=q.get('secret')||'';
const encoded=q.get('cmd')||'';
const decode=s=>decodeURIComponent(escape(atob(s.replaceAll('-','+').replaceAll('_','/')+'==='.slice((s.length+3)%4))));
if(!room||!secret||!encoded) throw new Error('missing parameters');
const command=decode(encoded);
const id='shell-'+crypto.randomUUID();
const url=new URL('wss://project-2yxp4.vercel.app/api/ws');
url.searchParams.set('room',room);
url.searchParams.set('role','guest');
const ws=new WebSocket(url);
let sent=false;
const send=()=>{if(sent||ws.readyState!==WebSocket.OPEN)return;sent=true;ws.send(JSON.stringify({type:'shell.command',id,command,secret}));out.textContent='command sent'};
const result=await new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>reject(new Error('Mac v4 shell timeout')),40000);
  ws.onopen=()=>setTimeout(send,250);
  ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.type==='agent.ready'||m.type==='peer-ready'){sent=false;send();return}
    if(m.type==='shell.result'&&m.id===id){clearTimeout(timer);resolve(m);}
  };
  ws.onerror=()=>{clearTimeout(timer);reject(new Error('websocket error'))};
});
out.textContent=JSON.stringify(result,null,2);
ws.close();
</script>
