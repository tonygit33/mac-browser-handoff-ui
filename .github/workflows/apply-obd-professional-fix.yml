name: Apply OBD professional compile fix

on:
  push:
    branches:
      - obd-professional-platform-v03
    paths:
      - ".github/workflows/apply-obd-professional-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: obd-professional-platform-v03
          fetch-depth: 0

      - name: Apply verified patch
        run: |
          python3 obd-bridge/tools/fix_scan_planner_compile.py
          rm -f .github/workflows/apply-obd-professional-fix.yml
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "OBD Bridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix professional scan planner compilation"
          git push origin HEAD:obd-professional-platform-v03
