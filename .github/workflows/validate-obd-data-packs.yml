name: Validate OBD Diagnostic Data

on:
  pull_request:
    paths:
      - "obd-bridge/Resources/VehicleDataPacks/**"
      - "obd-bridge/schemas/**"
      - "obd-bridge/tools/**"
      - ".github/workflows/validate-obd-data-packs.yml"
  push:
    branches:
      - main
      - obd-professional-platform-v03
    paths:
      - "obd-bridge/Resources/VehicleDataPacks/**"
      - "obd-bridge/schemas/**"
      - "obd-bridge/tools/**"
      - ".github/workflows/validate-obd-data-packs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validators and optional database compiler
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5" "cantools>=41,<42"

      - name: Compile-check tools
        run: python -m py_compile obd-bridge/tools/*.py

      - name: Validate vehicle data packs
        run: python obd-bridge/tools/validate_vehicle_data_packs.py

      - name: Validate schemas parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('obd-bridge/schemas').glob('*.json'):
              json.loads(path.read_text())
              print(f'parsed {path}')
          PY
