name: Apply OBD maximum-depth patch

on:
  push:
    branches:
      - main
    paths:
      - "tools/patch_obd_max_depth.py"
      - ".github/workflows/apply-obd-max-depth.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified one-shot patch
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/patch_obd_max_depth.py
          python3 tools/patch_obd_max_depth.py
          rm -f .github/workflows/apply-obd-max-depth.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture every supported PID and expose session files"
          git push origin HEAD:main
