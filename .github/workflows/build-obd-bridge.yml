name: Build OBD Bridge IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "obd-bridge/**"
      - ".github/workflows/build-obd-bridge.yml"
  push:
    branches:
      - obd-bridge-mvp
    paths:
      - "obd-bridge/**"
      - ".github/workflows/build-obd-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: obd-bridge
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: obd-bridge
        run: |
          set -euo pipefail
          xcodebuild \
            -project OBDBridge.xcodeproj \
            -scheme OBDBridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: obd-bridge
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload OBDBridge-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload OBDBridge-unsigned.ipa
          ls -lh OBDBridge-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OBDBridge-unsigned-ipa
          path: obd-bridge/OBDBridge-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
