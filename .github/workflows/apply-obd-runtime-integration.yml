name: Apply OBD professional runtime integration

on:
  push:
    branches:
      - obd-professional-runtime-v031
    paths:
      - ".github/workflows/apply-obd-runtime-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: obd-professional-runtime-v031
          fetch-depth: 0

      - name: Apply verified integration patch
        run: |
          python3 obd-bridge/tools/integrate_professional_runtime.py
          rm -f .github/workflows/apply-obd-runtime-integration.yml
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "OBD Bridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Connect live OBD sessions to AI snapshot runtime"
          git push origin HEAD:obd-professional-runtime-v031
