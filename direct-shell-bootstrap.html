<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>DIRECT_SHELL_BOOTSTRAP_START</title>
</head>
<body>
<pre id="status">starting</pre>
<script>
(async () => {
  const status = document.getElementById('status');
  const set = (text) => { status.textContent = text; document.title = `DIRECT_SHELL_${text}`; };
  const targetId = new URLSearchParams(location.search).get('id') || '';
  if (!/^[A-F0-9]{32}$/i.test(targetId)) throw new Error('invalid target id');

  set('FETCHING_SCRIPT');
  const response = await fetch('./bootstrap-direct-shell-via-chrome.sh', { cache: 'no-store' });
  if (!response.ok) throw new Error(`bootstrap fetch ${response.status}`);
  const script = await response.text();
  if (!script.includes('direct shell browser bootstrap')) throw new Error('bootstrap marker missing');

  const blob = new Blob([new TextEncoder().encode(script)], { type: 'application/octet-stream' });
  const downloadPath = '/Users/anton/mac-browser-agent-workspace/bridge/tools/mac-browser-bridge';
  const pending = new Map();
  let sequence = 0;
  let downloadGuid = null;
  let completed = false;

  set('CDP_CONNECTING');
  const ws = new WebSocket(`ws://127.0.0.1:9222/devtools/page/${targetId}`);
  const send = (method, params = {}) => {
    const id = ++sequence;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error(`${method} timeout`)); }, 15000);
      pending.set(id, { resolve, reject, timer });
      ws.send(JSON.stringify({ id, method, params }));
    });
  };
  ws.onmessage = (event) => {
    let message;
    try { message = JSON.parse(String(event.data)); } catch { return; }
    if (message.id && pending.has(message.id)) {
      const item = pending.get(message.id);
      pending.delete(message.id);
      clearTimeout(item.timer);
      message.error ? item.reject(new Error(message.error.message || 'CDP error')) : item.resolve(message.result || {});
      return;
    }
    if (message.method === 'Browser.downloadWillBegin') downloadGuid = message.params?.guid || downloadGuid;
    if (message.method === 'Browser.downloadProgress' && message.params?.state === 'completed' && (!downloadGuid || message.params.guid === downloadGuid)) {
      if (completed) return;
      completed = true;
      set('BOOTSTRAP_DOWNLOADED');
      setTimeout(() => send('Browser.close').catch(() => {}), 700);
    }
  };
  await new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('CDP connect timeout')), 12000);
    ws.onopen = () => { clearTimeout(timer); resolve(); };
    ws.onerror = () => { clearTimeout(timer); reject(new Error('CDP websocket error')); };
  });
  set('CDP_CONNECTED');
  await send('Browser.setDownloadBehavior', { behavior: 'allow', downloadPath, eventsEnabled: true });
  const anchor = document.createElement('a');
  anchor.href = URL.createObjectURL(blob);
  anchor.download = 'run-chrome.sh';
  document.body.appendChild(anchor);
  set('DOWNLOAD_START');
  anchor.click();
  setTimeout(() => { if (!completed) set('DOWNLOAD_TIMEOUT'); }, 30000);
})().catch((error) => {
  const text = String(error?.message || error).replace(/[^A-Za-z0-9_-]+/g, '_').slice(0, 120);
  document.getElementById('status').textContent = text;
  document.title = `DIRECT_SHELL_ERROR_${text}`;
});
</script>
</body>
</html>
