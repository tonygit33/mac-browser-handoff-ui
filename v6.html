<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#090a0d"><title>Mac Browser v6</title><style>:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{height:100%;display:flex;flex-direction:column}.top{min-height:52px;display:flex;align-items:center;gap:9px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#15171c;border-bottom:1px solid #292c33}.dot{width:9px;height:9px;border-radius:50%;background:#e4a11b}.dot.ok{background:#24c76a}.title{font-weight:750;flex:1}.badge{font-size:12px;color:#b7bdc8;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{position:relative;flex:1;min-height:0;background:#050608;touch-action:none;overflow:hidden}.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#050608;user-select:none;-webkit-user-drag:none}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#aeb4c0;pointer-events:none}.toolbar{display:flex;gap:7px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#15171c;border-top:1px solid #292c33}.toolbar button{flex:0 0 auto;border:0;border-radius:10px;padding:11px 13px;background:#2a2e37;color:#fff;font-weight:700;font-size:15px}.toolbar .primary{background:#1677ff}.toolbar .danger{background:#b53b40}#ime{position:fixed;left:-9999px;top:0;opacity:0}.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#111e;border:1px solid #445;padding:9px 12px;border-radius:10px;font-size:13px;display:none;z-index:5;max-width:88vw;text-align:center}</style></head><body><div id="app"><div class="top"><span id="dot" class="dot"></span><span class="title">Mac Browser v6</span><span id="state" class="badge">connecting</span></div><div id="stage" class="stage"><video id="video" autoplay playsinline muted></video><div id="empty" class="empty">Connecting directly to MacBook…</div><div id="toast" class="toast"></div></div><div class="toolbar"><button id="keyboard" class="primary">Keyboard</button><button data-key="Backspace">⌫</button><button data-key="Tab">Tab</button><button data-key="Enter">Enter</button><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><button id="done" class="danger">Готово</button></div></div><input id="ime" autocomplete="off" autocapitalize="none" spellcheck="false"><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const q=new URLSearchParams(location.hash.slice(1)||location.search.slice(1)),ROOM=(q.get('room')||'').toUpperCase(),SECRET=q.get('token')||q.get('secret')||'',PEER_ID=q.get('peer')||'';
const video=document.getElementById('video'),stage=document.getElementById('stage'),state=document.getElementById('state'),dot=document.getElementById('dot'),empty=document.getElementById('empty'),ime=document.getElementById('ime'),toast=document.getElementById('toast');
const ICE={iceServers:[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'},{urls:'stun:openrelay.metered.ca:80'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}],sdpSemantics:'unified-plan'};

function say(text){toast.textContent=String(text||'');toast.style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.display='none',1600)}

async function digest(text){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(bytes)].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('')}

function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw}catch{return}if(m?.type!=='control.result')return;const item=pending.get(m.id);if(!item)return;pending.delete(m.id);clearTimeout(item.timer);m.error?item.reject(new Error(m.error)):item.resolve(m.result)}
function bind(connection){try{conn?.close()}catch{}conn=connection;connection.on('open',()=>status(video.srcObject?'P2P video + control':'P2P control',true));connection.on('data',receive);connection.on('close',()=>{if(conn===connection)conn=null;if(!closed){status('control reconnecting');retryTimer=setTimeout(connectHost,900)}});connection.on('error',e=>{status('control '+(e?.type||'error'));if(!closed){clearTimeout(retryTimer);retryTimer=setTimeout(connectHost,900)}})}
async function connectHost(){if(closed||!peer||peer.destroyed)return;const id=await hostId();try{bind(peer.connect(id,{metadata:{secret:SECRET},serialization:'json',reliable:true}))}catch{retryTimer=setTimeout(connectHost,1000)}}
async function start(){clearTimeout(retryTimer);if(typeof Peer!=='function'){status('PeerJS library failed');retryTimer=setTimeout(start,1500);return}try{peer?.destroy()}catch{}peer=new Peer(undefined,{debug:1,config:ICE});peer.on('open',connectHost);peer.on('call',c=>{if(c.metadata?.secret!==SECRET){c.close();return}try{call?.close()}catch{}call=c;c.answer();c.on('stream',stream=>{video.srcObject=stream;empty.style.display='none';video.play().catch(()=>{});status(conn?.open?'P2P video + control':'P2P video',true)});c.on('close',()=>{if(call===c)call=null;if(!closed){video.srcObject=null;empty.style.display='flex';status('video reconnecting')}});c.on('error',e=>status('video '+(e?.type||'error')));});peer.on('error',e=>{if(e.type==='peer-unavailable'){retryTimer=setTimeout(connectHost,900)}else{status('signal '+(e?.type||'error'));if(['network','server-error','socket-error','socket-closed'].includes(e.type))retryTimer=setTimeout(start,1500)}});peer.on('disconnected',()=>{const live=conn?.open===true&&!!video.srcObject;status(live?'P2P live · signaling disconnected':'signaling reconnecting',live);try{peer.reconnect()}catch{retryTimer=setTimeout(start,1200)}})}
function command(payload){if(closed||!conn?.open)return Promise.reject(new Error('not connected'));const id='a'+Date.now().toString(36)+(++seq).toString(36);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('control timeout'))},12000);pending.set(id,{resolve,reject,timer});conn.send({type:'control.command',id,payload})})}
function point(event){const r=video.getBoundingClientRect(),vw=video.videoWidth||r.width,vh=video.videoHeight||r.height,scale=Math.min(r.width/vw,r.height/vh),w=vw*scale,h=vh*scale,left=r.left+(r.width-w)/2,top=r.top+(r.height-h)/2;return{x:(event.clientX-left)/w,y:(event.clientY-top)/h,inside:event.clientX>=left&&event.clientX<=left+w&&event.clientY>=top&&event.clientY<=top+h}}
stage.addEventListener('pointerdown',event=>{stage.setPointerCapture(event.pointerId);const p=point(event);lastX=p.x;lastY=p.y;moved=false;event.preventDefault()},{passive:false});stage.addEventListener('pointermove',event=>{if(!stage.hasPointerCapture(event.pointerId))return;const p=point(event),dy=p.y-lastY,dx=p.x-lastX;if(Math.abs(dx)+Math.abs(dy)>.008)moved=true;const now=Date.now();if(Math.abs(dy)>.01&&now-lastScroll>45){lastScroll=now;command({op:'wheel',deltaX:0,deltaY:-dy*900}).catch(()=>{});lastX=p.x;lastY=p.y}event.preventDefault()},{passive:false});stage.addEventListener('pointerup',event=>{const p=point(event);if(!moved&&p.inside)command({op:'tap',x:Math.max(0,Math.min(1,p.x)),y:Math.max(0,Math.min(1,p.y))}).then(result=>{if(result?.active?.keyboard)ime.focus({preventScroll:true})}).catch(error=>say(error.message));event.preventDefault()},{passive:false});
document.getElementById('keyboard').onclick=()=>ime.focus({preventScroll:true});document.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>command({op:'key',key:button.dataset.key}).catch(error=>say(error.message)));document.getElementById('back').onclick=()=>command({op:'back'}).catch(error=>say(error.message));document.getElementById('forward').onclick=()=>command({op:'forward'}).catch(error=>say(error.message));document.getElementById('reload').onclick=()=>command({op:'reload'}).catch(error=>say(error.message));

document.getElementById('done').onclick=async()=>{try{await command({op:'done'})}catch{}closed=true;clearTimeout(retryTimer);try{conn?.close()}catch{}try{call?.close()}catch{}try{peer?.destroy()}catch{}video.srcObject=null;empty.textContent='Управление возвращено агенту';empty.style.display='flex';status('closed')};
if(!/^[A-Z2-9]{6}$/.test(ROOM)||SECRET.length<24){closed=true;status('invalid link');empty.textContent='Ссылка недействительна'}else start();
window.__v6={command,disconnectSignal(){try{peer?.disconnect()}catch{}},get channel(){return conn?.open?'open':'closed'},get video(){return !!video.srcObject},get signal(){return peer?.open?'open':(peer?.disconnected?'disconnected':'closed')}};
