<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#090a0d">
  <title>Mac Browser v5</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app{height:100%;display:flex;flex-direction:column}.top{min-height:52px;display:flex;align-items:center;gap:9px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#15171c;border-bottom:1px solid #292c33}
    .dot{width:9px;height:9px;border-radius:50%;background:#e4a11b}.dot.ok{background:#24c76a}.title{font-weight:750;flex:1}.badge{font-size:12px;color:#b7bdc8;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .stage{position:relative;flex:1;min-height:0;background:#050608;touch-action:none;overflow:hidden}.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#050608;user-select:none;-webkit-user-drag:none}
    .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#aeb4c0;pointer-events:none}.toolbar{display:flex;gap:7px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#15171c;border-top:1px solid #292c33}
    .toolbar button{flex:0 0 auto;border:0;border-radius:10px;padding:11px 13px;background:#2a2e37;color:#fff;font-weight:700;font-size:15px}.toolbar .primary{background:#1677ff}.toolbar .danger{background:#b53b40}
    #ime{position:fixed;left:-9999px;top:0;opacity:0}.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#111e;border:1px solid #445;padding:9px 12px;border-radius:10px;font-size:13px;display:none;z-index:5;max-width:88vw;text-align:center}
  </style>
</head>
<body>
<div id="app">
  <div class="top"><span id="dot" class="dot"></span><span class="title">Mac Browser v5</span><span id="state" class="badge">connecting</span></div>
  <div id="stage" class="stage"><video id="video" autoplay playsinline muted></video><div id="empty" class="empty">Connecting directly to MacBook…</div><div id="toast" class="toast"></div></div>
  <div class="toolbar"><button id="keyboard" class="primary">Keyboard</button><button data-key="Backspace">⌫</button><button data-key="Tab">Tab</button><button data-key="Enter">Enter</button><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><button id="done" class="danger">Готово</button></div>
</div>
<input id="ime" autocomplete="off" autocapitalize="none" spellcheck="false">
<script>
const q=new URLSearchParams(location.hash.slice(1)||location.search.slice(1));
const ROOM=(q.get('room')||'').toUpperCase(),SECRET=q.get('token')||q.get('secret')||'',SIGNAL=q.get('signal')||'wss://project-2yxp4.vercel.app/api/ws';
const video=document.getElementById('video'),stage=document.getElementById('stage'),state=document.getElementById('state'),dot=document.getElementById('dot'),empty=document.getElementById('empty'),ime=document.getElementById('ime'),toast=document.getElementById('toast');
let ws=null,pc=null,dc=null,closed=false,reconnectTimer=null,lastX=0,lastY=0,moved=false,lastScroll=0,composing=false;
const pending=new Map(),iceQueue=[];
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}],sdpSemantics:'unified-plan'};
function say(text){toast.textContent=String(text||'');toast.style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.display='none',1600)}
function status(text,ok=false){state.textContent=text;dot.classList.toggle('ok',ok)}
function signalSend(message){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({...message,secret:SECRET}))}
function handleResult(message){const item=pending.get(message.id);if(!item)return;pending.delete(message.id);clearTimeout(item.timer);message.error?item.reject(new Error(message.error)):item.resolve(message.result)}
function receive(raw){let message;try{message=typeof raw==='string'?JSON.parse(raw):raw}catch{return}if(message?.type==='control.result')handleResult(message)}
function command(payload){if(closed)return Promise.reject(new Error('session closed'));const id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('control timeout'))},12000);pending.set(id,{resolve,reject,timer});const message={type:'control.command',id,payload};if(dc?.readyState==='open')dc.send(JSON.stringify(message));else if(ws?.readyState===WebSocket.OPEN)signalSend(message);else{clearTimeout(timer);pending.delete(id);reject(new Error('offline'))}})}
function resetPeer(){try{dc?.close()}catch{}try{pc?.close()}catch{}pc=null;dc=null;video.srcObject=null;empty.style.display='flex'}
function ensurePeer(){if(pc)return pc;pc=new RTCPeerConnection(ICE);pc.ontrack=event=>{video.srcObject=event.streams[0];empty.style.display='none';video.play().catch(()=>{});status(dc?.readyState==='open'?'P2P video + control':'P2P video',true)};pc.ondatachannel=event=>{dc=event.channel;dc.onopen=()=>status(video.srcObject?'P2P video + control':'P2P control',true);dc.onmessage=event=>receive(event.data);dc.onclose=()=>{dc=null;if(!closed)status(video.srcObject?'video live, control fallback':'control reconnecting',!!video.srcObject)}};pc.onicecandidate=event=>{if(event.candidate)signalSend({type:'webrtc.ice',candidate:event.candidate})};pc.onconnectionstatechange=()=>{const s=pc?.connectionState;if(s==='connected')status('P2P video + control',true);if(['failed','closed'].includes(s)){resetPeer();if(!closed)signalSend({type:'viewer.ready'})}};return pc}
async function handleSignal(message){if(message.type==='peer-ready'){signalSend({type:'viewer.ready'});return}if(message.type==='peer-left'){if(pc?.connectionState==='connected'&&dc?.readyState==='open'){status('P2P live · signaling rotating',true);return}resetPeer();status('Mac reconnecting');return}if(message.secret!==SECRET)return;if(message.type==='webrtc.offer'){const peer=ensurePeer();await peer.setRemoteDescription(message.sdp);while(iceQueue.length){try{await peer.addIceCandidate(iceQueue.shift())}catch{}}const answer=await peer.createAnswer();await peer.setLocalDescription(answer);signalSend({type:'webrtc.answer',sdp:peer.localDescription});return}if(message.type==='webrtc.ice'&&message.candidate){const peer=ensurePeer();if(peer.remoteDescription){try{await peer.addIceCandidate(message.candidate)}catch{}}else iceQueue.push(message.candidate);return}if(message.type==='control.result')receive(message)}
function connect(){if(closed)return;clearTimeout(reconnectTimer);const url=new URL(SIGNAL);url.searchParams.set('room',ROOM);url.searchParams.set('role','guest');ws=new WebSocket(url);ws.onopen=()=>{const live=pc?.connectionState==='connected'&&dc?.readyState==='open';status(live?'P2P live · signaling online':'signaling online',live);signalSend({type:'viewer.ready'})};ws.onmessage=event=>{let message;try{message=JSON.parse(event.data)}catch{return}handleSignal(message).catch(error=>{status('signal error');say(error.message)})};ws.onerror=()=>{const live=pc?.connectionState==='connected'&&dc?.readyState==='open';status(live?'P2P live · signaling error':'signaling error',live)};ws.onclose=()=>{ws=null;const live=pc?.connectionState==='connected'&&dc?.readyState==='open';if(!live)resetPeer();if(!closed){status(live?'P2P live · signaling reconnecting':'signaling reconnecting',live);reconnectTimer=setTimeout(connect,1200)}}}
function point(event){const r=video.getBoundingClientRect(),vw=video.videoWidth||r.width,vh=video.videoHeight||r.height,scale=Math.min(r.width/vw,r.height/vh),w=vw*scale,h=vh*scale,left=r.left+(r.width-w)/2,top=r.top+(r.height-h)/2;return{x:(event.clientX-left)/w,y:(event.clientY-top)/h,inside:event.clientX>=left&&event.clientX<=left+w&&event.clientY>=top&&event.clientY<=top+h}}
stage.addEventListener('pointerdown',event=>{stage.setPointerCapture(event.pointerId);const p=point(event);lastX=p.x;lastY=p.y;moved=false;event.preventDefault()},{passive:false});
stage.addEventListener('pointermove',event=>{if(!stage.hasPointerCapture(event.pointerId))return;const p=point(event),dy=p.y-lastY,dx=p.x-lastX;if(Math.abs(dx)+Math.abs(dy)>.008)moved=true;const now=Date.now();if(Math.abs(dy)>.01&&now-lastScroll>45){lastScroll=now;command({op:'wheel',deltaX:0,deltaY:-dy*900}).catch(()=>{});lastX=p.x;lastY=p.y}event.preventDefault()},{passive:false});
stage.addEventListener('pointerup',event=>{const p=point(event);if(!moved&&p.inside)command({op:'tap',x:Math.max(0,Math.min(1,p.x)),y:Math.max(0,Math.min(1,p.y))}).then(result=>{if(result?.active?.keyboard)ime.focus({preventScroll:true})}).catch(error=>say(error.message));event.preventDefault()},{passive:false});
document.getElementById('keyboard').onclick=()=>ime.focus({preventScroll:true});
document.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>command({op:'key',key:button.dataset.key}).catch(error=>say(error.message)));
document.getElementById('back').onclick=()=>command({op:'back'}).catch(error=>say(error.message));document.getElementById('forward').onclick=()=>command({op:'forward'}).catch(error=>say(error.message));document.getElementById('reload').onclick=()=>command({op:'reload'}).catch(error=>say(error.message));
ime.addEventListener('compositionstart',()=>composing=true);ime.addEventListener('compositionend',event=>{composing=false;if(event.data)command({op:'type',text:event.data}).catch(error=>say(error.message));ime.value=''});ime.addEventListener('beforeinput',event=>{if(composing)return;if(event.inputType==='deleteContentBackward'){event.preventDefault();command({op:'key',key:'Backspace'}).catch(error=>say(error.message))}else if(event.inputType==='insertLineBreak'){event.preventDefault();command({op:'key',key:'Enter'}).catch(error=>say(error.message))}else if(event.data){event.preventDefault();command({op:'type',text:event.data}).catch(error=>say(error.message))}ime.value=''});
document.getElementById('done').onclick=async()=>{try{await command({op:'done'})}catch{}closed=true;clearTimeout(reconnectTimer);try{ws?.close()}catch{}resetPeer();empty.textContent='Управление возвращено агенту';empty.style.display='flex';status('closed')};
if(!/^[A-Z2-9]{6}$/.test(ROOM)||SECRET.length<24){closed=true;status('invalid link');empty.textContent='Ссылка недействительна'}else connect();
window.__v5={command,closeSignal(){try{ws?.close()}catch{}},get channel(){return dc?.readyState==='open'?'open':(ws?.readyState===WebSocket.OPEN?'websocket':'offline')},get video(){return !!video.srcObject},get state(){return pc?.connectionState||'none'}};
</script>
</body>
</html>
