<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive"><title>Mac Browser v4</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.stage{position:fixed;inset:0;background:#050608;touch-action:none;overflow:hidden}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.top{position:fixed;z-index:20;left:8px;right:8px;top:calc(7px + env(safe-area-inset-top));display:flex;gap:7px;align-items:center;pointer-events:none}.pill{height:36px;border:0;border-radius:999px;padding:0 13px;background:#17191de8;color:#fff;font:700 13px -apple-system,BlinkMacSystemFont,system-ui;box-shadow:0 4px 18px #0008;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:auto}.state{font-size:11px;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d9dde5}.grow{flex:1}.done{background:#cf3e42}.tools{position:fixed;z-index:20;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.tool{width:46px;height:46px;border:0;border-radius:50%;background:#17191deb;color:#fff;font-size:19px;box-shadow:0 5px 20px #0009}.keyboard{position:fixed;z-index:30;left:7px;right:7px;bottom:calc(7px + env(safe-area-inset-bottom));display:none;grid-template-columns:1fr auto;gap:7px;padding:8px;background:#17191df5;border-radius:16px;box-shadow:0 12px 40px #000c}.keyboard.open{display:grid}.keyboard textarea{height:45px;min-width:0;resize:none;border:1px solid #3d424c;border-radius:11px;background:#08090b;color:#fff;padding:11px 12px;font:16px -apple-system,BlinkMacSystemFont,system-ui}.keyboard button{height:45px;border:0;border-radius:11px;background:#1677ff;color:#fff;padding:0 14px;font-weight:750}.keyrow{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}.keyrow button{height:35px;background:#343840;flex:0 0 auto}.closed{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#090a0d;padding:28px}.closed.show{display:flex}.closed h1{font-size:25px;margin:0 0 10px}.closed p{color:#adb3bd;line-height:1.5}.hint{position:fixed;z-index:12;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:#111d;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .3s}.pulse{animation:pulse 1.1s infinite}@keyframes pulse{50%{opacity:.45}}</style></head>
<body><div id="stage" class="stage"><video id="video" class="media" autoplay playsinline muted></video></div><div class="top"><button id="back" class="pill">←</button><button id="reload" class="pill">↻</button><div id="state" class="pill state pulse">Подключение…</div><div class="grow"></div><button id="done" class="pill done">Готово</button></div><div class="tools"><button id="keyboardButton" class="tool">⌨︎</button><button id="mobile" class="tool">▯</button></div><div id="hint" class="hint">Касание — клик · свайп — прокрутка</div><div id="keyboard" class="keyboard"><textarea id="ime" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Введите текст"></textarea><button id="send">Ввести</button><div class="keyrow"><button data-key="Backspace">⌫</button><button id="clear">Очистить</button><button data-key="Tab">Tab</button><button data-key="Enter">Enter</button><button id="kbdDone">Готово</button></div></div><div id="closed" class="closed"><div><h1>Доступ закрыт</h1><p>Сессию можно закрыть. Агент продолжит работу.</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script><script>
const q=new URLSearchParams(location.hash.slice(1)),ROOM=(q.get('room')||'').toUpperCase(),SECRET=q.get('secret')||'',EXPIRES=Number(q.get('expires')||0),stage=document.getElementById('stage'),video=document.getElementById('video'),stateEl=document.getElementById('state'),keyboard=document.getElementById('keyboard'),ime=document.getElementById('ime');let peer=null,conn=null,call=null,closed=false,seq=0,retryTimer=null;const pending=new Map(),pointers=new Map();let single=null;
function status(t,ok=false){stateEl.textContent=t;stateEl.classList.toggle('pulse',!ok)}function finish(){if(closed)return;closed=true;clearTimeout(retryTimer);try{conn?.close()}catch{}try{call?.close()}catch{}try{peer?.destroy()}catch{}document.getElementById('closed').classList.add('show')}
if(ROOM.length!==6||SECRET.length<20||(EXPIRES&&Date.now()>=EXPIRES)){status('Ссылка недействительна');finish();throw new Error('invalid session')}
async function digest(text){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(bytes)].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join('')}async function hostId(){return 'mbv4h-'+ROOM.toLowerCase()+'-'+await digest(SECRET)}
function result(m){const p=pending.get(m.id);if(p){pending.delete(m.id);m.error?p.reject(new Error(m.error)):p.resolve(m.result)}if(m.result?.active?.keyboard)openKeyboard(m.result.active);status(video.srcObject?'LIVE · WebRTC':'CONTROL · WebRTC',true)}
function bind(c){conn=c;c.on('open',()=>status('CONTROL · WebRTC',true));c.on('data',m=>{if(m?.type==='result')result(m)});c.on('close',()=>{conn=null;if(!closed){status('Переподключение…');retryTimer=setTimeout(connectHost,900)}});c.on('error',()=>status('Ошибка управления'))}
async function connectHost(){if(closed||!peer||peer.destroyed)return;const id=await hostId();try{bind(peer.connect(id,{metadata:{secret:SECRET},serialization:'json',reliable:true}))}catch{retryTimer=setTimeout(connectHost,1000)}}
async function start(){if(typeof Peer!=='function'){status('PeerJS не загрузился');retryTimer=setTimeout(start,1500);return}peer=new Peer(undefined,{debug:1,config:{iceServers:[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}],sdpSemantics:'unified-plan'}});peer.on('open',connectHost);peer.on('call',c=>{if(c.metadata?.secret!==SECRET){c.close();return}try{call?.close()}catch{}call=c;c.answer();c.on('stream',stream=>{video.srcObject=stream;status('LIVE · WebRTC',true)});c.on('close',()=>{video.srcObject=null;if(!closed)status('Видео переподключается…')});c.on('error',()=>status('Ошибка видео'))});peer.on('error',e=>{if(e.type==='peer-unavailable'){clearTimeout(retryTimer);retryTimer=setTimeout(connectHost,900)}else{status('Сеть: '+e.type);if(['network','server-error','socket-error','socket-closed'].includes(e.type))setTimeout(()=>{try{peer.destroy()}catch{}start()},1500)}});peer.on('disconnected',()=>{status('Signaling reconnect…');try{peer.reconnect()}catch{setTimeout(start,1200)}})}
function act(action){if(closed||!conn?.open)return Promise.reject(new Error('not connected'));const id='a'+Date.now().toString(36)+(++seq).toString(36);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('timeout'))},12000);pending.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}});conn.send({id,action,secret:SECRET});status('Команда…')})}
function rect(){const r=stage.getBoundingClientRect(),w=video.videoWidth||390,h=video.videoHeight||720,s=Math.min(r.width/w,r.height/h),cw=w*s,ch=h*s;return{left:r.left+(r.width-cw)/2,top:r.top+(r.height-ch)/2,width:cw,height:ch}}function point(x,y){const r=rect();return{x:Math.max(0,Math.min(1,(x-r.left)/r.width)),y:Math.max(0,Math.min(1,(y-r.top)/r.height)),inside:x>=r.left&&x<=r.left+r.width&&y>=r.top&&y<=r.top+r.height}}function complete(s,e){if(!s)return;const dx=e.x-s.x,dy=e.y-s.y,d=Date.now()-s.t;if(!s.moved&&d<650){const p=point(e.x,e.y);if(p.inside)act({op:'tap',x:p.x,y:p.y}).catch(()=>{});return}if(Math.abs(dy)>Math.abs(dx)*1.1&&Math.abs(dy)>18){act({op:'wheel',deltaX:0,deltaY:Math.round(-dy*2.7)}).catch(()=>{});return}if(d>420&&Math.abs(dx)>24){const a=point(s.x,s.y),b=point(e.x,e.y);if(a.inside&&b.inside)act({op:'drag',x1:a.x,y1:a.y,x2:b.x,y2:b.y}).catch(()=>{})}}
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,1);if(pointers.size===1)single={x:e.clientX,y:e.clientY,t:Date.now(),moved:false};e.preventDefault()},{passive:false});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;if(single&&Math.hypot(e.clientX-single.x,e.clientY-single.y)>7)single.moved=true;e.preventDefault()},{passive:false});stage.addEventListener('pointerup',e=>{const s=single;pointers.delete(e.pointerId);if(!pointers.size){single=null;complete(s,{x:e.clientX,y:e.clientY})}e.preventDefault()},{passive:false});stage.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(!pointers.size)single=null});
const SENT='\u200B';let suppress=false,composing=false;function arm(){suppress=true;ime.value=SENT;try{ime.setSelectionRange(1,1)}catch{}setTimeout(()=>suppress=false,0)}function openKeyboard(a={}){keyboard.classList.add('open');ime.inputMode=a.inputMode||(['number','tel','email','url','search'].includes(a.type)?a.type:'text');arm();setTimeout(()=>ime.focus({preventScroll:true}),20)}function closeKeyboard(){ime.blur();ime.value='';keyboard.classList.remove('open')}function type(t){if(t)act({op:'type',text:t}).catch(()=>{});arm()}function erase(){act({op:'key',key:'Backspace'}).catch(()=>{});arm()}
ime.addEventListener('compositionstart',()=>composing=true);ime.addEventListener('compositionend',e=>{composing=false;type(e.data||'')});ime.addEventListener('beforeinput',e=>{if(composing)return;if(e.inputType==='deleteContentBackward'){e.preventDefault();erase()}else if(e.inputType==='insertText'&&e.data){e.preventDefault();type(e.data)}else if(e.inputType==='insertLineBreak'){e.preventDefault();act({op:'key',key:'Enter'}).catch(()=>{});arm()}});ime.addEventListener('input',()=>{if(suppress||composing)return;const v=ime.value;if(!v||v.length<SENT.length){erase();return}const added=v.startsWith(SENT)?v.slice(1):v.replace(SENT,'');if(added)type(added);else arm()});document.getElementById('send').onclick=()=>{const v=ime.value.replace(SENT,'');if(v)type(v);closeKeyboard()};document.getElementById('keyboardButton').onclick=()=>keyboard.classList.contains('open')?closeKeyboard():openKeyboard();document.getElementById('kbdDone').onclick=closeKeyboard;document.getElementById('clear').onclick=()=>{act({op:'clear'}).catch(()=>{});arm()};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{act({op:'key',key:b.dataset.key}).catch(()=>{});arm()});document.getElementById('back').onclick=()=>act({op:'back'}).catch(()=>{});document.getElementById('reload').onclick=()=>act({op:'reload'}).catch(()=>{});document.getElementById('mobile').onclick=()=>act({op:'viewport',width:390,height:720,mobile:true}).catch(()=>{});document.getElementById('done').onclick=finish;setTimeout(()=>document.getElementById('hint').style.opacity='0',6500);setInterval(()=>{if(EXPIRES&&Date.now()>=EXPIRES)finish()},1000);start();
</script></body></html>
