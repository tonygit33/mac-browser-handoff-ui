<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mac Browser v4</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.stage{position:fixed;inset:0;background:#050608;touch-action:none;overflow:hidden}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.fallback{display:none}.top{position:fixed;z-index:20;left:8px;right:8px;top:calc(7px + env(safe-area-inset-top));display:flex;gap:7px;align-items:center;pointer-events:none}.pill{height:36px;border:0;border-radius:999px;padding:0 13px;background:#17191de8;color:#fff;font:700 13px -apple-system,BlinkMacSystemFont,system-ui;box-shadow:0 4px 18px #0008;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:auto}.state{font-size:11px;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d9dde5}.grow{flex:1}.done{background:#cf3e42}.tools{position:fixed;z-index:20;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.tool{width:46px;height:46px;border:0;border-radius:50%;background:#17191deb;color:#fff;font-size:19px;box-shadow:0 5px 20px #0009}.keyboard{position:fixed;z-index:30;left:7px;right:7px;bottom:calc(7px + env(safe-area-inset-bottom));display:none;grid-template-columns:1fr auto;gap:7px;padding:8px;background:#17191df5;border-radius:16px;box-shadow:0 12px 40px #000c}.keyboard.open{display:grid}.keyboard textarea{height:45px;min-width:0;resize:none;border:1px solid #3d424c;border-radius:11px;background:#08090b;color:#fff;padding:11px 12px;font:16px -apple-system,BlinkMacSystemFont,system-ui}.keyboard button{height:45px;border:0;border-radius:11px;background:#1677ff;color:#fff;padding:0 14px;font-weight:750}.keyrow{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}.keyrow button{height:35px;background:#343840;flex:0 0 auto}.closed{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#090a0d;padding:28px}.closed.show{display:flex}.closed h1{font-size:25px;margin:0 0 10px}.closed p{color:#adb3bd;line-height:1.5}.hint{position:fixed;z-index:12;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:#111d;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .3s}.pulse{animation:pulse 1.1s infinite}@keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>
<div id="stage" class="stage"><video id="video" class="media" autoplay playsinline muted></video><img id="fallback" class="media fallback" alt="Remote browser"></div>
<div class="top"><button id="back" class="pill">←</button><button id="reload" class="pill">↻</button><div id="state" class="pill state pulse">Подключение…</div><div class="grow"></div><button id="done" class="pill done">Готово</button></div>
<div class="tools"><button id="keyboardButton" class="tool">⌨︎</button><button id="home" class="tool">⌂</button></div>
<div id="hint" class="hint">Касание — клик · свайп — прокрутка</div>
<div id="keyboard" class="keyboard"><textarea id="ime" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Введите текст"></textarea><button id="send">Ввести</button><div class="keyrow"><button data-key="Backspace">⌫</button><button id="clear">Очистить</button><button data-key="Tab">Tab</button><button data-key="Enter">Enter</button><button id="kbdDone">Готово</button></div></div>
<div id="closed" class="closed"><div><h1>Доступ закрыт</h1><p>Сессию можно закрыть. Агент продолжит работу.</p></div></div>
<script>
const WS='wss://project-2yxp4.vercel.app/api/ws';
const params=new URLSearchParams(location.hash.slice(1));
const ROOM=(params.get('room')||'').toUpperCase(),SECRET=params.get('secret')||'',EXPIRES=Number(params.get('expires')||0);
const stage=document.getElementById('stage'),video=document.getElementById('video'),fallback=document.getElementById('fallback'),stateEl=document.getElementById('state'),keyboard=document.getElementById('keyboard'),ime=document.getElementById('ime');
let ws=null,pc=null,dc=null,reconnectTimer=null,closed=false,seq=0,lastMedia='none',peer=false;
const pending=new Map(),pointers=new Map();let single=null;
function status(text,ok=false){stateEl.textContent=text;stateEl.classList.toggle('pulse',!ok)}
function valid(){return ROOM.length===6&&SECRET.length>=20&&(!EXPIRES||Date.now()<EXPIRES)}
if(!valid()){document.getElementById('closed').classList.add('show');status('Ссылка недействительна');throw new Error('Invalid session')}
function sendWs(payload){if(ws?.readyState===1)ws.send(JSON.stringify({...payload,secret:SECRET}))}
function closePeer(){try{dc?.close()}catch{}try{pc?.close()}catch{}dc=null;pc=null;video.srcObject=null}
function setupChannel(channel){dc=channel;dc.onopen=()=>{status('LIVE · WebRTC',true);lastMedia='webrtc';fallback.style.display='none';video.style.display='block'};dc.onclose=()=>{dc=null;status('WebSocket fallback')};dc.onmessage=e=>handleMessage(e.data)}
async function acceptOffer(message){closePeer();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});pc.onicecandidate=e=>e.candidate&&sendWs({type:'webrtc.ice',candidate:e.candidate});pc.ontrack=e=>{video.srcObject=e.streams[0];video.style.display='block';fallback.style.display='none';lastMedia='webrtc';status('LIVE · WebRTC',true)};pc.ondatachannel=e=>setupChannel(e.channel);pc.onconnectionstatechange=()=>{const s=pc?.connectionState;if(s==='failed'||s==='disconnected')status('WebSocket fallback');if(s==='failed')closePeer()};await pc.setRemoteDescription(message.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);sendWs({type:'webrtc.answer',sdp:pc.localDescription})}
async function handleSignal(message){if(message.secret&&message.secret!==SECRET)return;if(message.type==='peer-ready'||message.type==='host.ready'){peer=true;sendWs({type:'viewer.ready'});return}if(message.type==='webrtc.offer'&&message.sdp){await acceptOffer(message);return}if(message.type==='webrtc.ice'&&message.candidate&&pc){try{await pc.addIceCandidate(message.candidate)}catch{}return}if(message.type==='frame'&&message.data&&lastMedia!=='webrtc'){fallback.src=message.data;fallback.style.display='block';video.style.display='none';lastMedia='ws-frame';status('LIVE · WebSocket',true);return}if(message.type==='control.result')handleResult(message);if(message.type==='session.closed')finishLocal()}
function handleMessage(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw}catch{return}if(m.secret&&m.secret!==SECRET)return;if(m.type==='control.result')handleResult(m);if(m.type==='session.closed')finishLocal()}
function handleResult(m){const p=pending.get(m.id);if(p){pending.delete(m.id);p.resolve(m.result)}const active=m.result?.active;if(active?.keyboard)openKeyboard(active);status(dc?.readyState==='open'?'LIVE · WebRTC':'LIVE · WebSocket',true)}
function connect(){clearTimeout(reconnectTimer);ws=new WebSocket(WS+'?room='+encodeURIComponent(ROOM)+'&role=guest');ws.onopen=()=>{status('Ожидание Mac…');sendWs({type:'viewer.ready'});sendAction({op:'wake'}).catch(()=>{})};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handleSignal(m).catch(()=>{})};ws.onclose=()=>{peer=false;if(!closed){status('Переподключение…');reconnectTimer=setTimeout(connect,1200)}};ws.onerror=()=>{try{ws.close()}catch{}}}
function sendAction(action){if(closed)return Promise.reject(new Error('closed'));const id='a'+Date.now().toString(36)+(++seq).toString(36),payload={type:'action',id,action,secret:SECRET};return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('timeout'))},12000);pending.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject});if(dc?.readyState==='open')dc.send(JSON.stringify(payload));else sendWs({type:'control.ws',id,action});status('Команда…')})}
function mediaRect(){const r=stage.getBoundingClientRect();const w=video.videoWidth||fallback.naturalWidth||390,h=video.videoHeight||fallback.naturalHeight||720,scale=Math.min(r.width/w,r.height/h),cw=w*scale,ch=h*scale;return{left:r.left+(r.width-cw)/2,top:r.top+(r.height-ch)/2,width:cw,height:ch}}
function point(x,y){const r=mediaRect();return{x:Math.max(0,Math.min(1,(x-r.left)/r.width)),y:Math.max(0,Math.min(1,(y-r.top)/r.height)),inside:x>=r.left&&x<=r.left+r.width&&y>=r.top&&y<=r.top+r.height}}
function complete(start,end){if(!start)return;const dx=end.x-start.x,dy=end.y-start.y,d=Date.now()-start.t;if(!start.moved&&d<650){const p=point(end.x,end.y);if(p.inside)sendAction({op:'tap',x:p.x,y:p.y}).catch(()=>{});return}if(Math.abs(dy)>Math.abs(dx)*1.1&&Math.abs(dy)>18){sendAction({op:'wheel',deltaX:0,deltaY:Math.round(-dy*2.7)}).catch(()=>{});return}if(d>420&&Math.abs(dx)>24){const a=point(start.x,start.y),b=point(end.x,end.y);if(a.inside&&b.inside)sendAction({op:'drag',x1:a.x,y1:a.y,x2:b.x,y2:b.y}).catch(()=>{})}}
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)single={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,t:Date.now(),moved:false};e.preventDefault()},{passive:false});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(single){single.lastX=e.clientX;single.lastY=e.clientY;if(Math.hypot(e.clientX-single.x,e.clientY-single.y)>7)single.moved=true}e.preventDefault()},{passive:false});
stage.addEventListener('pointerup',e=>{const s=single;pointers.delete(e.pointerId);if(pointers.size===0){single=null;complete(s,{x:e.clientX,y:e.clientY})}e.preventDefault()},{passive:false});
stage.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(!pointers.size)single=null});
const SENT='\u200B';let suppress=false,composing=false;
function arm(){suppress=true;ime.value=SENT;try{ime.setSelectionRange(1,1)}catch{}setTimeout(()=>suppress=false,0)}
function openKeyboard(active={}){keyboard.classList.add('open');ime.inputMode=active.inputMode||(['number','tel','email','url','search'].includes(active.type)?active.type:'text');arm();setTimeout(()=>ime.focus({preventScroll:true}),20)}
function closeKeyboard(){ime.blur();ime.value='';keyboard.classList.remove('open')}
function typeText(text){if(text)sendAction({op:'type',text}).catch(()=>{});arm()}
function backspace(){sendAction({op:'key',key:'Backspace'}).catch(()=>{});arm()}
ime.addEventListener('compositionstart',()=>composing=true);ime.addEventListener('compositionend',e=>{composing=false;typeText(e.data||'')});ime.addEventListener('beforeinput',e=>{if(composing)return;if(e.inputType==='deleteContentBackward'){e.preventDefault();backspace()}else if(e.inputType==='insertText'&&e.data){e.preventDefault();typeText(e.data)}else if(e.inputType==='insertLineBreak'){e.preventDefault();sendAction({op:'key',key:'Enter'}).catch(()=>{});arm()}});ime.addEventListener('input',()=>{if(suppress||composing)return;const v=ime.value;if(!v||v.length<SENT.length){backspace();return}const added=v.startsWith(SENT)?v.slice(1):v.replace(SENT,'');if(added)typeText(added);else arm()});
document.getElementById('send').onclick=()=>{const v=ime.value.replace(SENT,'');if(v)typeText(v);closeKeyboard()};document.getElementById('keyboardButton').onclick=()=>keyboard.classList.contains('open')?closeKeyboard():openKeyboard();document.getElementById('kbdDone').onclick=closeKeyboard;document.getElementById('clear').onclick=()=>{sendAction({op:'clear'}).catch(()=>{});arm()};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{sendAction({op:'key',key:b.dataset.key}).catch(()=>{});arm()});
document.getElementById('back').onclick=()=>sendAction({op:'back'}).catch(()=>{});document.getElementById('reload').onclick=()=>sendAction({op:'reload'}).catch(()=>{});document.getElementById('home').onclick=()=>sendAction({op:'viewport',width:390,height:720,mobile:true}).catch(()=>{});
function finishLocal(){closed=true;clearTimeout(reconnectTimer);try{ws?.close()}catch{}closePeer();document.getElementById('closed').classList.add('show')}
document.getElementById('done').onclick=()=>{sendWs({type:'viewer.done'});finishLocal()};
setTimeout(()=>document.getElementById('hint').style.opacity='0',6500);setInterval(()=>{if(EXPIRES&&Date.now()>=EXPIRES)finishLocal()},1000);connect();
</script>
</body>
</html>
