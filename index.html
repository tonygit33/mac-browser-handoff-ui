<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Remote Chrome</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}button,input{font:inherit}.top{position:fixed;z-index:8;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;pointer-events:none}.pill{height:36px;border:0;border-radius:999px;background:#17191dcc;color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:0 13px;font-weight:700;box-shadow:0 4px 18px #0007;pointer-events:auto}.state{font-size:12px;color:#d5d8df}.grow{flex:1}.done{background:#d83c3e}.stage{position:fixed;inset:0;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#000}.surface{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.frame{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;background:#101114}.hint{position:fixed;z-index:7;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:#fff;background:#111c;padding:7px 11px;border-radius:999px;backdrop-filter:blur(10px);pointer-events:none;opacity:.9;transition:opacity .25s;white-space:nowrap}.tools{position:fixed;z-index:9;right:12px;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.tool{width:46px;height:46px;border:0;border-radius:50%;background:#17191de8;color:#fff;font-size:20px;box-shadow:0 4px 18px #0008}.keyboard{position:fixed;z-index:12;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:none;grid-template-columns:1fr auto;gap:8px;padding:9px;border-radius:16px;background:#17191df5;box-shadow:0 10px 35px #000b}.keyboard.open{display:grid}.keyboard input{height:46px;min-width:0;border:1px solid #3a3e46;border-radius:12px;background:#08090b;color:#fff;padding:0 13px}.keyboard button{height:46px;border:0;border-radius:12px;background:#1677ff;color:#fff;font-weight:750;padding:0 16px}.keyrow{grid-column:1/-1;display:flex;gap:7px;overflow-x:auto}.keyrow button{height:36px;background:#34373e;flex:0 0 auto;padding:0 13px}.closed{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#090a0d;padding:30px}.closed.show{display:flex}.closed h1{font-size:27px;margin:0 0 10px}.closed p{color:#aeb3bd;line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="top"><button id="back" class="pill">←</button><div id="state" class="pill state">Подключение…</div><div class="grow"></div><button id="done" class="pill done">Готово</button></div>
<div id="stage" class="stage"><div id="surface" class="surface"><img id="frame" class="frame" alt="Экран браузера"></div></div>
<div id="hint" class="hint">Свайп — прокрутка · касание — клик · удержать и тянуть — drag</div>
<div class="tools"><button id="keyboardButton" class="tool">⌨︎</button><button id="resetZoom" class="tool">1×</button></div>
<div id="keyboard" class="keyboard"><input id="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Введите текст"><button id="send">Ввести</button><div class="keyrow"><button data-key="Enter">Enter</button><button data-key="Tab">Tab</button><button data-key="Backspace">⌫</button><button data-key="Escape">Esc</button></div></div>
<div id="closed" class="closed"><div><h1>Доступ закрыт</h1><p>Действие завершено. Эту страницу можно закрыть.</p></div></div>
<script>
const RELAY='https://mac-browser-handoff-proxy.vercel.app/api/relay';
const params=new URLSearchParams(location.hash.slice(1));
const secret=params.get('secret')||'',session=params.get('session')||'',mode=params.get('mode')||'once';
const frame=document.getElementById('frame'),surface=document.getElementById('surface'),stage=document.getElementById('stage'),stateEl=document.getElementById('state'),hint=document.getElementById('hint'),keyboard=document.getElementById('keyboard'),text=document.getElementById('text');
let naturalW=390,naturalH=844,fitScale=1,zoom=1,tx=0,ty=0,refreshTimer=null,closed=false,commandBusy=false,pending=null,lastFrameAt=0,gestureActive=false;
const pointers=new Map();let gesture=null,single=null;
if(!secret||!session){stateEl.textContent='Ссылка недействительна';document.getElementById('closed').classList.add('show');throw new Error('Missing access data')}
document.getElementById('done').textContent=mode==='hold'?'Закрыть':'Готово';
function relayUrl(op){const u=new URL(RELAY);u.searchParams.set('op',op);u.searchParams.set('secret',secret);u.searchParams.set('_',Date.now());return u.toString()}
function sendNow(payload){const body={...payload,sessionId:session};commandBusy=true;stateEl.textContent='BUSY';fetch(relayUrl('command'),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body),cache:'no-store',keepalive:true}).catch(()=>{}).finally(()=>{setTimeout(()=>{commandBusy=false;if(pending){const next=pending;pending=null;sendNow(next)}},350)});setTimeout(refreshFrame,420)}
function command(payload){if(closed)return;if(commandBusy){pending=payload;return}sendNow(payload)}
function apply(){surface.style.width=naturalW+'px';surface.style.height=naturalH+'px';surface.style.transform=`translate(${tx}px,${ty}px) scale(${fitScale*zoom})`;document.getElementById('resetZoom').textContent=zoom===1?'1×':zoom.toFixed(1)+'×'}
function resetView(){const sw=stage.clientWidth,sh=stage.clientHeight;fitScale=Math.min(sw/naturalW,sh/naturalH);zoom=1;tx=(sw-naturalW*fitScale)/2;ty=(sh-naturalH*fitScale)/2;apply()}
function setZoom(next,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const old=fitScale*zoom;zoom=Math.max(1,Math.min(7,next));const now=fitScale*zoom;tx=cx-(cx-tx)*(now/old);ty=cy-(cy-ty)*(now/old);zoom===1?resetView():apply()}
function normalized(x,y){const r=surface.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(x-r.left)/r.width)),y:Math.max(0,Math.min(1,(y-r.top)/r.height)),inside:x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}}
function refreshFrame(){if(closed||gestureActive||pointers.size)return;frame.onload=()=>{naturalW=frame.naturalWidth||naturalW;naturalH=frame.naturalHeight||naturalH;if(!lastFrameAt)resetView();lastFrameAt=Date.now();stateEl.textContent='LIVE'};frame.onerror=()=>{stateEl.textContent='Ожидание Mac…'};frame.src=relayUrl('frame')}
function schedule(){clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')refreshFrame()},850)}
function closeKeyboard(){keyboard.classList.remove('open');text.blur()}
function openKeyboard(){keyboard.classList.add('open');setTimeout(()=>text.focus(),50)}
function finish(){if(closed)return;sendNow({op:'done'});closed=true;clearInterval(refreshTimer);document.getElementById('closed').classList.add('show')}
stage.addEventListener('pointerdown',e=>{gestureActive=true;stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)single={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,t:Date.now(),moved:false};if(pointers.size===2){const a=[...pointers.values()];gesture={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom,tx,ty,midX:(a[0].x+a[1].x)/2,midY:(a[0].y+a[1].y)/2};single=null}});
stage.addEventListener('pointermove',e=>{const prev=pointers.get(e.pointerId);if(!prev)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&gesture){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,old=fitScale*gesture.zoom;zoom=Math.max(1,Math.min(7,gesture.zoom*d/Math.max(1,gesture.distance)));const now=fitScale*zoom;tx=mx-(gesture.midX-gesture.tx)*(now/old);ty=my-(gesture.midY-gesture.ty)*(now/old);apply()}else if(pointers.size===1&&single){const dx=e.clientX-single.lastX,dy=e.clientY-single.lastY;single.lastX=e.clientX;single.lastY=e.clientY;if(Math.hypot(e.clientX-single.x,e.clientY-single.y)>7)single.moved=true;if(zoom>1){tx+=dx;ty+=dy;apply()}}e.preventDefault()},{passive:false});
function complete(start,end,cancelled=false){if(!start)return;const dx=end.x-start.x,dy=end.y-start.y,duration=Date.now()-start.t;if(!start.moved&&!cancelled&&duration<600){const p=normalized(end.x,end.y);if(p.inside)command({op:'tap',x:p.x,y:p.y});return}if(zoom!==1)return;const a=normalized(start.x,start.y),b=normalized(end.x,end.y);if(Math.abs(dy)>Math.abs(dx)*1.15&&Math.abs(dy)>18){command({op:'scroll',deltaY:Math.round(-dy*2.5),deltaX:0})}else if(!cancelled&&duration>420&&Math.abs(dx)>25&&a.inside&&b.inside){command({op:'drag',x1:a.x,y1:a.y,x2:b.x,y2:b.y})}}
stage.addEventListener('pointerup',e=>{const start=single,end={x:e.clientX,y:e.clientY};pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(start&&pointers.size===0)complete(start,end,false);if(pointers.size===0){single=null;gestureActive=false;setTimeout(refreshFrame,60)}e.preventDefault()},{passive:false});
stage.addEventListener('pointercancel',e=>{const start=single,end={x:single?.lastX??e.clientX,y:single?.lastY??e.clientY};pointers.delete(e.pointerId);if(start&&pointers.size===0)complete(start,end,true);gesture=null;single=null;gestureActive=false;setTimeout(refreshFrame,60)});
document.getElementById('back').onclick=()=>command({op:'back'});document.getElementById('done').onclick=finish;document.getElementById('keyboardButton').onclick=()=>keyboard.classList.contains('open')?closeKeyboard():openKeyboard();document.getElementById('resetZoom').onclick=resetView;document.getElementById('send').onclick=()=>{if(text.value){command({op:'type',text:text.value});text.value=''}closeKeyboard()};text.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('send').click()}});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>command({op:'key',key:b.dataset.key}));addEventListener('resize',()=>{if(zoom===1)resetView()});addEventListener('pagehide',()=>{if(mode==='once'&&!closed)command({op:'heartbeat'})});
setTimeout(()=>hint.style.opacity='0',7000);command({op:'wake'});command({op:'viewport',width:390,height:844,mobile:true});refreshFrame();schedule();
</script>
</body>
</html>
