name: OBDBridge
options:
  bundleIdPrefix: com.anton
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  OBDBridge:
    type: application
    platform: iOS
    sources:
      - path: OBDBridge
      - path: Resources
        buildPhase: resources
    info:
      path: OBDBridge/Info.plist
      properties:
        CFBundleDisplayName: OBD Bridge
        CFBundleShortVersionString: "0.4.3"
        CFBundleVersion: "9"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        OBDAnalysisEndpoint: https://project-2yxp4-kache.vercel.app/api/bridge-realtime?command=obd-analyze
        NSBluetoothAlwaysUsageDescription: OBD Bridge uses Bluetooth to communicate with your paired OBDLink MX+ adapter.
        UISupportedExternalAccessoryProtocols:
          - com.obdlink
        UIBackgroundModes:
          - external-accessory
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anton.obdbridge
        PRODUCT_NAME: OBDBridge
        MARKETING_VERSION: "0.4.3"
        CURRENT_PROJECT_VERSION: "9"
        INFOPLIST_FILE: OBDBridge/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - OBDBridgeTests
        - OBDBridgeUITests

  OBDBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OBDBridgeTests
    dependencies:
      - target: OBDBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anton.obdbridge.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  OBDBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OBDBridgeUITests
    dependencies:
      - target: OBDBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anton.obdbridge.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
