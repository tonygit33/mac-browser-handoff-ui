name: OBDBridge
options:
  bundleIdPrefix: com.anton
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  OBDBridge:
    type: application
    platform: iOS
    sources:
      - path: OBDBridge
    info:
      path: OBDBridge/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anton.obdbridge
        PRODUCT_NAME: OBDBridge
        INFOPLIST_FILE: OBDBridge/Info.plist
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
