<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#090a0d">
  <title>Mac Browser v7.1</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app{height:100%;display:flex;flex-direction:column}.top{min-height:52px;display:flex;align-items:center;gap:9px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#15171c;border-bottom:1px solid #292c33}
    .dot{width:9px;height:9px;border-radius:50%;background:#e4a11b}.dot.ok{background:#24c76a}.title{font-weight:750;flex:1}.badge{font-size:12px;color:#b7bdc8;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .stage{position:relative;flex:1;min-height:0;background:#050608;touch-action:none;overflow:hidden}.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#050608;user-select:none;-webkit-user-drag:none}
    .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#aeb4c0;pointer-events:none}.toolbar{display:flex;gap:7px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#15171c;border-top:1px solid #292c33}
    .toolbar button{flex:0 0 auto;border:0;border-radius:10px;padding:11px 13px;background:#2a2e37;color:#fff;font-weight:700;font-size:15px}.toolbar .primary{background:#1677ff}.toolbar .danger{background:#b53b40}
    #ime{position:fixed;left:-9999px;top:0;opacity:0}.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#111e;border:1px solid #445;padding:9px 12px;border-radius:10px;font-size:13px;display:none;z-index:5;max-width:88vw;text-align:center}
  </style>
</head>
<body>
<div id="app">
  <div class="top"><span id="dot" class="dot"></span><span class="title">Mac Browser v7.1 · iPhone 11</span><span id="state" class="badge">connecting</span></div>
  <div id="stage" class="stage"><video id="video" autoplay playsinline muted></video><div id="empty" class="empty">Connecting directly to MacBook…</div><div id="toast" class="toast"></div></div>
  <div class="toolbar"><button id="keyboard" class="primary">Keyboard</button><button data-key="Backspace">⌫</button><button data-key="Tab">Tab</button><button data-key="Enter">Enter</button><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><button id="done" class="danger">Готово</button></div>
</div>
<input id="ime" autocomplete="off" autocapitalize="none" spellcheck="false">
<script src="https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js"></script>
<script>
const hashQ=new URLSearchParams(location.hash.slice(1)),searchQ=new URLSearchParams(location.search.slice(1));
const ROOM=(hashQ.get('room')||searchQ.get('room')||'').toUpperCase();
const SECRET=hashQ.get('token')||hashQ.get('secret')||searchQ.get('token')||'';
const TARGET_URL=hashQ.get('url')||searchQ.get('url')||'';
const E2E=searchQ.get('e2e')==='1';
const video=document.getElementById('video'),stage=document.getElementById('stage'),state=document.getElementById('state'),dot=document.getElementById('dot'),empty=document.getElementById('empty'),ime=document.getElementById('ime'),toast=document.getElementById('toast');
const BROKER='wss://broker.emqx.io:8084/mqtt';
const ICE={iceServers:[
  {urls:'stun:stun.cloudflare.com:3478'},
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
],iceCandidatePoolSize:4,sdpSemantics:'unified-plan'};
const enc=new TextEncoder(),dec=new TextDecoder(),viewerId=crypto.randomUUID();
let mq=null,topicHost='',topicViewer='',cryptoKey=null,pc=null,dc=null,closed=false,readyTimer=null,seq=0,lastX=0,lastY=0,moved=false,lastScroll=0,composing=false,e2eDone=false,profileSent=false;
let pendingRemoteIce=[];
const pending=new Map();
function say(text){toast.textContent=String(text||'');toast.style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>toast.style.display='none',1800)}
function status(text,ok=false){state.textContent=text;dot.classList.toggle('ok',ok)}
function hex(bytes){return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function b64(bytes){let s='';const a=new Uint8Array(bytes);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'')}
function unb64(text){const s=text.replaceAll('-','+').replaceAll('_','/')+'==='.slice((text.length+3)%4);const raw=atob(s);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function digest(text){return crypto.subtle.digest('SHA-256',enc.encode(text))}
async function initCrypto(){const h=hex(await digest('mbv71-topic:'+ROOM+':'+SECRET)).slice(0,48);topicHost='mbv71/'+h+'/host';topicViewer='mbv71/'+h+'/viewer';const raw=await digest('mbv71-key:'+ROOM+':'+SECRET);cryptoKey=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function seal(value){const iv=crypto.getRandomValues(new Uint8Array(12)),plain=enc.encode(JSON.stringify(value)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode(topicHost.slice(0,-5))},cryptoKey,plain),out=new Uint8Array(iv.length+cipher.byteLength);out.set(iv);out.set(new Uint8Array(cipher),iv.length);return b64(out)}
async function openPayload(text){const all=unb64(text),iv=all.slice(0,12),cipher=all.slice(12),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:enc.encode(topicHost.slice(0,-5))},cryptoKey,cipher);return JSON.parse(dec.decode(plain))}
async function publish(topic,value){if(!mq?.connected)return;mq.publish(topic,await seal({...value,room:ROOM,at:Date.now()}),{qos:0,retain:false})}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw}catch{return}if(m?.type!=='control.result')return;const item=pending.get(m.id);if(!item)return;pending.delete(m.id);clearTimeout(item.timer);m.error?item.reject(new Error(m.error)):item.resolve(m.result)}
function command(payload){if(closed||dc?.readyState!=='open')return Promise.reject(new Error('not connected'));const id='a'+Date.now().toString(36)+(++seq).toString(36);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('control timeout'))},15000);pending.set(id,{resolve,reject,timer});dc.send(JSON.stringify({type:'control.command',id,payload}))})}
function closePeer(){try{dc?.close()}catch{}try{pc?.close()}catch{}dc=null;pc=null;profileSent=false;pendingRemoteIce=[];video.srcObject=null;empty.style.display='flex'}
function deviceProfile(){return{userAgent:navigator.userAgent,language:navigator.language||'en-US',languages:navigator.languages||[],timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Kyiv',screenWidth:screen.width,screenHeight:screen.height,innerWidth,innerHeight,devicePixelRatio:devicePixelRatio||2,maxTouchPoints:navigator.maxTouchPoints||5}}
async function syncProfile(){if(profileSent||dc?.readyState!=='open')return;profileSent=true;try{await command({op:'deviceProfile',profile:deviceProfile(),url:TARGET_URL});status('iPhone 11 profile · P2P',true);maybeE2E()}catch(error){profileSent=false;status('profile retrying');say(error.message);setTimeout(syncProfile,900)}}
function maybeReady(){const live=dc?.readyState==='open'&&!!video.srcObject;if(live){status(profileSent?'iPhone 11 profile · P2P':'P2P connected',true);clearInterval(readyTimer);syncProfile()}return live}
async function maybeE2E(){if(!E2E||e2eDone||dc?.readyState!=='open'||!video.srcObject||!profileSent)return;e2eDone=true;try{const r=await command({op:'viewport'});if(!r?.ok||r.width!==414||r.height!==896)throw new Error('iPhone profile mismatch');status('E2E PASS · iPhone 11',true)}catch(error){e2eDone=false;status('E2E FAIL');say(error.message)}}
function bindData(channel){dc=channel;channel.onopen=()=>{maybeReady()||status('P2P control',true)};channel.onmessage=e=>receive(e.data);channel.onclose=()=>{if(dc===channel)dc=null;if(!closed){status(video.srcObject?'video live · control reconnecting':'control reconnecting',!!video.srcObject);sendReady()}};channel.onerror=()=>status('control error')}
async function addRemoteCandidate(candidate){if(!pc||!candidate)return;if(!pc.remoteDescription){pendingRemoteIce.push(candidate);return}try{await pc.addIceCandidate(candidate)}catch(error){console.warn('remote ICE',error)}}
async function acceptOffer(message){
  if(message.viewerId!==viewerId||!message.sdp)return;
  if(pc&&['new','connecting','connected'].includes(pc.connectionState))return;
  closePeer();
  const peer=new RTCPeerConnection(ICE);pc=peer;
  peer.ontrack=event=>{if(pc!==peer)return;video.srcObject=event.streams[0];empty.style.display='none';video.play().catch(()=>{});maybeReady()||status('P2P video',true)};
  peer.ondatachannel=event=>{if(pc===peer)bindData(event.channel)};
  peer.onicecandidate=e=>{if(pc===peer&&e.candidate)publish(topicHost,{type:'webrtc.ice',viewerId,candidate:e.candidate.toJSON()})};
  peer.onconnectionstatechange=()=>{if(pc!==peer)return;const s=peer.connectionState;if(s==='connected')maybeReady();if(['failed','closed'].includes(s)&&!closed){closePeer();status('P2P reconnecting');sendReady()}};
  try{
    await peer.setRemoteDescription(message.sdp);
    for(const c of pendingRemoteIce.splice(0))await addRemoteCandidate(c);
    await peer.setLocalDescription(await peer.createAnswer());
    await publish(topicHost,{type:'webrtc.answer',viewerId,sdp:peer.localDescription});
    status('answer sent · gathering ICE',true);
  }catch(error){if(pc===peer)closePeer();status('answer error');console.error(error);sendReady()}
}
async function onSignal(message){if(message.room!==ROOM)return;if(message.type==='host.ready'){if(dc?.readyState!=='open')sendReady();return}if(message.viewerId!==viewerId)return;if(message.type==='webrtc.offer'){await acceptOffer(message);return}if(message.type==='webrtc.ice')await addRemoteCandidate(message.candidate)}
async function sendReady(){if(closed||dc?.readyState==='open')return;await publish(topicHost,{type:'viewer.ready',viewerId,version:'7.1'})}
function connectMqtt(){
  if(typeof mqtt!=='object'&&typeof mqtt!=='function'){status('MQTT library failed');setTimeout(connectMqtt,1500);return}
  const clientId='mbv71-view-'+crypto.randomUUID().replaceAll('-','');
  mq=mqtt.connect(BROKER,{clientId,clean:true,reconnectPeriod:1200,connectTimeout:9000,keepalive:20,resubscribe:true});
  mq.on('connect',()=>{mq.subscribe(topicViewer,{qos:0},error=>{if(error){status('subscribe error');return}status(pc?.connectionState==='connected'?'P2P live · signaling online':'signaling online',pc?.connectionState==='connected');sendReady();clearInterval(readyTimer);readyTimer=setInterval(sendReady,1600)})});
  mq.on('message',async(topic,payload)=>{if(topic!==topicViewer)return;try{await onSignal(await openPayload(String(payload)))}catch(error){console.warn('signal decode',error)}});
  mq.on('reconnect',()=>status(pc?.connectionState==='connected'?'P2P live · signaling reconnecting':'signaling reconnecting',pc?.connectionState==='connected'));
  mq.on('offline',()=>status(pc?.connectionState==='connected'?'P2P live · signaling offline':'signaling offline',pc?.connectionState==='connected'));
  mq.on('error',error=>{console.error(error);status(pc?.connectionState==='connected'?'P2P live · signaling error':'signaling error',pc?.connectionState==='connected')})
}
function point(event){const r=video.getBoundingClientRect(),vw=video.videoWidth||r.width,vh=video.videoHeight||r.height,scale=Math.min(r.width/vw,r.height/vh),w=vw*scale,h=vh*scale,left=r.left+(r.width-w)/2,top=r.top+(r.height-h)/2;return{x:(event.clientX-left)/w,y:(event.clientY-top)/h,inside:event.clientX>=left&&event.clientX<=left+w&&event.clientY>=top&&event.clientY<=top+h}}
stage.addEventListener('pointerdown',event=>{stage.setPointerCapture(event.pointerId);const p=point(event);lastX=p.x;lastY=p.y;moved=false;event.preventDefault()},{passive:false});
stage.addEventListener('pointermove',event=>{if(!stage.hasPointerCapture(event.pointerId))return;const p=point(event),dy=p.y-lastY,dx=p.x-lastX;if(Math.abs(dx)+Math.abs(dy)>.008)moved=true;const now=Date.now();if(Math.abs(dy)>.01&&now-lastScroll>50){lastScroll=now;command({op:'wheel',deltaX:0,deltaY:-dy*820}).catch(()=>{});lastX=p.x;lastY=p.y}event.preventDefault()},{passive:false});
stage.addEventListener('pointerup',event=>{const p=point(event);if(!moved&&p.inside)command({op:'tap',x:Math.max(0,Math.min(1,p.x)),y:Math.max(0,Math.min(1,p.y))}).catch(error=>say(error.message));event.preventDefault()},{passive:false});
document.getElementById('keyboard').onclick=()=>ime.focus({preventScroll:true});
document.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>command({op:'key',key:button.dataset.key}).catch(error=>say(error.message)));
document.getElementById('back').onclick=()=>command({op:'back'}).catch(error=>say(error.message));
document.getElementById('forward').onclick=()=>command({op:'forward'}).catch(error=>say(error.message));
document.getElementById('reload').onclick=()=>command({op:'reload'}).catch(error=>say(error.message));
ime.addEventListener('compositionstart',()=>composing=true);
ime.addEventListener('compositionend',event=>{composing=false;if(event.data)command({op:'type',text:event.data}).catch(error=>say(error.message));ime.value=''});
ime.addEventListener('beforeinput',event=>{if(composing)return;if(event.inputType==='deleteContentBackward'){event.preventDefault();command({op:'key',key:'Backspace'}).catch(error=>say(error.message))}else if(event.inputType==='insertLineBreak'){event.preventDefault();command({op:'key',key:'Enter'}).catch(error=>say(error.message))}else if(event.data){event.preventDefault();command({op:'type',text:event.data}).catch(error=>say(error.message))}ime.value=''});
document.getElementById('done').onclick=async()=>{try{await command({op:'done'})}catch{}closed=true;clearInterval(readyTimer);try{mq?.end(true)}catch{}closePeer();empty.textContent='Управление возвращено агенту';empty.style.display='flex';status('closed')};
async function start(){if(!/^[A-Z2-9]{6}$/.test(ROOM)||SECRET.length<24){closed=true;status('invalid link');empty.textContent='Ссылка недействительна';return}await initCrypto();connectMqtt()}
start().catch(error=>{console.error(error);status('startup error')});
window.__v71={command,get channel(){return dc?.readyState||'closed'},get video(){return !!video.srcObject},get signal(){return mq?.connected?'open':'closed'},get state(){return pc?.connectionState||'none'},get profileSent(){return profileSent},get topic(){return topicViewer}};
</script>
</body>
</html>
